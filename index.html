<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เกมคัดแยกขยะ WasteBin</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <aside class="orientation-notice" aria-label="Landscape screen notice">
    <div class="phone-rotate" aria-hidden="true"></div>
    <strong>หมุนโทรศัพท์</strong>
    <span>เกมนี้เล่นได้ดีที่สุดในแนวนอน</span>
  </aside>

  <main class="game-shell">
    <header class="topbar">
      <div>
        <h1>ภารกิจคัดแยกขยะ WasteBin</h1>
        <p>ลากขยะให้ลงถังที่ถูกต้อง แล้วสะสมคะแนนกันเลย</p>
      </div>
      <div class="topbar-tools">
        <button id="qr-open" class="desktop-qr" type="button" aria-label="เปิด QR Code ขนาดใหญ่">
          <img src="qr.png" alt="QR Code สำหรับเล่นบนมือถือ">
          <span>สแกนเพื่อเล่นบนมือถือ</span>
        </button>

        <section class="scoreboard" aria-label="คะแนน">
        <div>
          <span id="score">0</span>
          <small>คะแนน</small>
        </div>
        <div>
          <span id="correct">0</span>
          <small>ถูกต้อง</small>
        </div>
        <div>
          <span id="wrong">0</span>
          <small>พลาด</small>
        </div>
        <div>
          <span id="remaining">0</span>
          <small>เหลือ</small>
        </div>
        </section>
      </div>
    </header>

    <section class="controls" aria-label="ปุ่มควบคุมเกม">
      <button id="new-game" type="button">เริ่มรอบใหม่</button>
      <label>
        จำนวนขยะ
        <select id="round-size">
          <option value="8">8</option>
          <option value="12" selected>12</option>
          <option value="16">16</option>
          <option value="24">24</option>
        </select>
      </label>
      <span id="message" role="status" aria-live="polite"></span>
    </section>

    <section class="play-area">
      <section class="bin-panel" aria-labelledby="bin-title">
        <h2 id="bin-title">เลือกถังให้ถูก</h2>
        <div id="bin-list" class="bin-grid"></div>
      </section>

      <section class="waste-panel" aria-labelledby="waste-title">
        <h2 id="waste-title">กองขยะรวม</h2>
        <span id="mobile-message" role="status" aria-live="polite"></span>
        <div id="waste-list" class="waste-grid"></div>
      </section>
    </section>
  </main>

  <template id="waste-template">
    <button class="waste-card" type="button" draggable="true">
      <img alt="">
      <span></span>
    </button>
  </template>

  <template id="bin-template">
    <button class="bin-card" type="button">
      <img alt="">
      <span></span>
    </button>
  </template>

  <div id="qr-modal" class="qr-modal" hidden>
    <div class="qr-modal-card" role="dialog" aria-modal="true" aria-label="QR Code สำหรับเล่นบนมือถือ">
      <button id="qr-close" class="qr-close" type="button" aria-label="ปิด">×</button>
      <img src="qr.png" alt="QR Code สำหรับเล่นบนมือถือ">
      <span>สแกนเพื่อเล่นบนมือถือ</span>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
